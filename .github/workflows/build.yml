name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release package
        shell: powershell
        run: .\Build.ps1 -Version 1.0.0

      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: TempGuard-1.0.0-win-x64
          path: |
            artifacts/TempGuard-1.0.0-win-x64.zip
            artifacts/TempGuard-1.0.0-win-x64.zip.sha256
          if-no-files-found: error
